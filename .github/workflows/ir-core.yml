name: IR core

on:
  pull_request:
    branches: [ir]
  push:
    branches: ['chat/ir-*']

permissions:
  contents: read

concurrency:
  group: ir-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ir-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Native Rust toolchain and decoder oracle
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          sudo apt-get update -qq
          sudo apt-get install -y nasm
      - name: Generate baseline dispatch tables and check IR decoder
        run: |
          mkdir -p build
          make src/rust/gen/interpreter.rs src/rust/gen/interpreter0f.rs src/rust/gen/jit.rs src/rust/gen/jit0f.rs src/rust/gen/analyzer.rs src/rust/gen/analyzer0f.rs
          make ir-generated-check
      - name: Native compiler regressions
        run: env RUSTFLAGS="-D warnings" cargo +stable test
      - name: Execute emitted Wasm
        run: |
          node tests/ir/wasm/run.mjs
          node tests/ir/wasm/licm.mjs
          node tests/rust/verify-wasmgen-dummy-output.js
          node tests/ir/decode/oracle.mjs
      - name: Check formatting and tracked generated sources
        if: always()
        run: |
          rustup run stable rustfmt --edition 2021 src/rust/ir/passes/licm.rs
          git diff --exit-code

  ir-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: CPU Wasm toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          sudo apt-get update -qq
          sudo apt-get install -y nasm clang lld
      - name: Live compile, cache, tier scheduling and backend regressions
        run: |
          set -o pipefail
          make ir-live-tests ir-cache-tests ir-auto-tests ir-backend-integration-tests 2>&1 | tee ir-runtime.log
      - name: Keep runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ir-runtime-${{ github.sha }}
          path: ir-runtime.log
          retention-days: 7
