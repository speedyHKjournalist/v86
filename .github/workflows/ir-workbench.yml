name: IR workbench

on:
  push:
    branches: ['chat/ir-11-licm-20260913']
    paths: ['.github/workflows/ir-workbench.yml']

permissions:
  contents: read

jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 32
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Prepare assembler and browser dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nasm
          mkdir -p build
          make closure-compiler/compiler.jar build/libv86.mjs build/libv86.js build/cpu-worker.js build/jit-capacity.bin build/cpu-worker-test.bin
          cp /usr/bin/nasm build/nasm
      - name: Preserve fixed reference objects without credentials or configuration
        run: |
          git fetch --no-tags --depth=2 https://github.com/speedyHKjournalist/v86.git 8ee73e538daaab15411344d39a1f271e778ac7f3
          git update-ref refs/heads/ir-reference 8ee73e538daaab15411344d39a1f271e778ac7f3
          paths=(objects refs HEAD)
          for item in packed-refs shallow; do
            if test -e ".git/$item"; then paths+=("$item"); fi
          done
          tar -C .git -czf build/ir-history.tar.gz "${paths[@]}"
          git archive --format=tar.gz --output=build/ir-source.tar.gz HEAD
          git rev-parse HEAD > build/ir-source-sha.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ir-test-support-${{ github.sha }}
          retention-days: 1
          path: |
            closure-compiler/compiler.jar
            build/nasm
            build/*.mjs
            build/*.js
            build/*.bin
            build/ir-history.tar.gz
            build/ir-source.tar.gz
            build/ir-source-sha.txt
