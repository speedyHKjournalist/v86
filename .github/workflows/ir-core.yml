name: IR core

on:
  pull_request:
    branches: [ir]
  push:
    branches: ['chat/ir-*']

permissions:
  contents: read

concurrency:
  group: ir-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ir-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preserve exact source checkpoint
        run: git archive --format=tar HEAD | gzip -1 > ir-source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ir-source-${{ github.sha }}
          retention-days: 1
          compression-level: 0
          path: ir-source.tar.gz
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Native Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          sudo apt-get update -qq
          sudo apt-get install -y nasm
      - name: Generate baseline dispatch tables and check IR decoder
        run: |
          mkdir -p build
          make src/rust/gen/interpreter.rs src/rust/gen/interpreter0f.rs src/rust/gen/jit.rs src/rust/gen/jit0f.rs src/rust/gen/analyzer.rs src/rust/gen/analyzer0f.rs
          make ir-generated-check
      - name: Native compiler regressions
        run: |
          set -o pipefail
          env RUSTFLAGS="-D warnings" cargo +stable test 2>&1 | tee build/ir-native.log
      - name: Execute emitted Wasm
        run: |
          set -o pipefail
          {
            node tests/ir/wasm/run.mjs
            node tests/rust/verify-wasmgen-dummy-output.js
            node tests/ir/decode/oracle.mjs
          } 2>&1 | tee build/ir-wasm.log
      - name: Check tracked generated sources
        run: git diff --exit-code
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ir-diagnostics-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ir-native.log
            build/ir-wasm.log

  ir-cpu:
    needs: ir-core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Wasm CPU toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          sudo apt-get update -qq
          sudo apt-get install -y nasm clang lld
      - name: CPU, memory, cache and online backend regressions
        run: |
          set -o pipefail
          mkdir -p build
          make ir-cfg-tests ir-loop-tests ir-memory-tests ir-backend-integration-tests ir-cache-tests ir-auto-tests 2>&1 | tee build/ir-cpu.log
      - name: Preserve CPU diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ir-cpu-diagnostics-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: build/ir-cpu.log
