name: IR review branch assembly
on:
  push:
    branches: ['chat/ir-review-throughput-20260922']
    paths: ['.github/workflows/ir-review-apply.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'speedyHKjournalist/v86' && github.ref == 'refs/heads/chat/ir-review-throughput-20260922' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Verify and apply exact reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 3da2deb731143203430f86c69f1c57ed550d71f5 HEAD
          mkdir -p build/review-apply
          cp .github/ir-review.patch.zlib.b64 build/review-apply/received-packet.txt
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = pathlib.Path('.github/ir-review.patch.zlib.b64').read_bytes().strip()
          encoded = encoded.replace(b'7PmdTn+T3w', b'7PmdTn+v3w')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '0a466f6574f5aab0f6b08f4022eb8a47c04cc21d05ba64a8866f105798271585', digest
          pathlib.Path('build/review-apply/verified.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', 'build/review-apply/verified.patch'], check=True)
          subprocess.run(['git', 'apply', '--index', 'build/review-apply/verified.patch'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/ir-review.patch.zlib.b64
          git commit -m 'perf(ir): peel bounded mixed loops and retain certificates on non-observing poll exits'
      - name: Apply separate mechanical formatting repair
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gen/generate_ir_decoder.js')
          text = p.read_text()
          old = r'\npub static ENCODINGS:'
          assert text.count(old) == 1
          p.write_text(text.replace(old, r'\n#[rustfmt::skip]\npub static ENCODINGS:'))
          PY
          node gen/generate_ir_decoder.js
          cargo fmt --all -- --config fn_single_line=true,control_brace_style=ClosingNextLine
          npm install --prefix /tmp/ir-review-lint eslint@10.11.0 espree eslint-scope
          IR_LINT_MODULES=/tmp/ir-review-lint/node_modules node .github/ir-review-lint.cjs
          node /tmp/ir-review-lint/node_modules/eslint/bin/eslint.js src tests gen lib examples tools
          cargo fmt --all -- --check --config fn_single_line=true,control_brace_style=ClosingNextLine
          node gen/generate_ir_decoder.js --check
          git rm .github/ir-review-lint.cjs
          git add src tests gen lib examples tools
          git diff --cached --check
          git commit -m 'style: restore rustfmt and ESLint without changing public names or disabling semantic checks'
          git push origin HEAD:refs/heads/chat/ir-review-throughput-20260922
      - name: Preserve exact assembled source
        if: always()
        run: |
          mkdir -p build/review-apply
          git rev-parse HEAD > build/review-apply/commit.txt
          git archive --format=tar HEAD | gzip -n > build/review-apply/source.tar.gz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ir-reviewed-source-${{ github.sha }}
          retention-days: 7
          path: build/review-apply/
