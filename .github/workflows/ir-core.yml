name: IR core

on:
  pull_request:
    branches: [ir]
  push:
    branches: ['chat/ir-*']

permissions:
  contents: read

concurrency:
  group: ir-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ir-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Native Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
      - name: Generate baseline dispatch tables and check IR decoder
        run: |
          mkdir -p build
          make src/rust/gen/interpreter.rs src/rust/gen/interpreter0f.rs src/rust/gen/jit.rs src/rust/gen/jit0f.rs src/rust/gen/analyzer.rs src/rust/gen/analyzer0f.rs
          make ir-generated-check
      - name: Native compiler regressions
        run: env RUSTFLAGS="-D warnings" cargo +stable test
      - name: Execute emitted Wasm
        run: |
          node tests/ir/wasm/run.mjs
          node tests/ir/wasm/licm.mjs
          node tests/rust/verify-wasmgen-dummy-output.js
          node tests/ir/decode/oracle.mjs
      - name: Check formatting and tracked generated sources
        run: |
          rustup run stable rustfmt --edition 2021 src/rust/ir/passes/licm.rs
          git diff --exit-code
