name: IR workbench

on:
  push:
    branches: ['chat/ir-11-licm-20260913']
    paths: ['.github/workflows/ir-workbench.yml']

permissions:
  contents: read

jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare compiler
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable wasm32-unknown-unknown
          rustup component add --toolchain stable rustfmt
      - name: Archive public source and isolated toolchain
        run: |
          git archive --format=tar HEAD | gzip -1 > ir-source.tar.gz
          sysroot="$(rustc +stable --print sysroot)"
          tar -C "$sysroot" --exclude='share/doc' --exclude='share/man' --exclude='lib/rustlib/src' -czf ir-toolchain.tar.gz bin/rustc bin/cargo bin/rustfmt lib
      - uses: actions/upload-artifact@v7
        with:
          name: ir-workbench-${{ github.sha }}
          retention-days: 1
          compression-level: 0
          path: |
            ir-source.tar.gz
            ir-toolchain.tar.gz
