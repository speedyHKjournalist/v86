name: IR offline validation toolchain

on:
  push:
    branches: ['chat/ir-completion-20260913']
    paths: ['.github/workflows/ir-toolchain-bootstrap.yml']

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare offline test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm
          mkdir -p "$RUNNER_TEMP/ir-prerequisites"
          cp "$(command -v nasm)" "$RUNNER_TEMP/ir-prerequisites/nasm"
          make closure-compiler/compiler.jar build/jit-capacity.bin build/cpu-worker-test.bin
          cp closure-compiler/compiler.jar build/jit-capacity.bin build/cpu-worker-test.bin "$RUNNER_TEMP/ir-prerequisites/"
      - uses: actions/upload-artifact@v7
        with:
          name: ir-offline-prerequisites
          path: ${{ runner.temp }}/ir-prerequisites
          retention-days: 1
