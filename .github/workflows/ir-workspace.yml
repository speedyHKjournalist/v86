name: IR workspace bootstrap

on:
  push:
    branches: ['chat/ir-continuation-20260913']
    paths: ['.github/workflows/ir-workspace.yml']

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Prepare the repository's pinned build dependency
        run: |
          make closure-compiler/compiler.jar
          sha256sum closure-compiler/compiler.jar > closure-compiler/SHA256SUMS
          node --version > closure-compiler/NODE_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: ir-build-dependencies
          path: closure-compiler/
          retention-days: 1
          compression-level: 0
