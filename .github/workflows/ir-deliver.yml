name: Deliver validated IR patch
on:
  push:
    branches: [chat/ir-dataflow-delivery-20260913]
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify and publish isolated code branch
        env:
          BASE: 04b3de9af6da7067f0fe05410853ca283b8797b4
          EXPECTED_TREE: f838e9b5658a902e8f8ed5fcdd3d5a863e18db7e
          TARGET: chat/ir-dataflow-20260913
        run: |
          set -euo pipefail
          cat transfer/ir-part-0.gz transfer/ir-part-1.gz transfer/ir-part-2-0.gz transfer/ir-part-2-1.gz transfer/ir-part-2-2.gz | gzip -d > "$RUNNER_TEMP/ir.patch"
          echo "1035f0dc91d370ad4706e696bccbc6c297be031abdad57c379cc7acea9a39a1e  $RUNNER_TEMP/ir.patch" | sha256sum --check
          test "$(git rev-parse origin/ir)" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = b90aa889ef9bbd43fc75874d8a464dda50acd3ad
          test -z "$(git ls-remote --heads origin "refs/heads/$TARGET")"
          git switch --detach "$BASE"
          git apply --index "$RUNNER_TEMP/ir.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(ir): add bounded LICM and scalar/SIMD dataflow simplification"
          git push origin "HEAD:refs/heads/$TARGET"
          git show --stat --oneline HEAD
