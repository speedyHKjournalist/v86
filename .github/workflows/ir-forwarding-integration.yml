name: IR forwarding integration

on:
  push:
    branches: ['chat/ir-11-licm-20260913']
    paths:
      - '.github/workflows/ir-forwarding-integration.yml'
      - 'tools/ir-forwarding-*.patch'

permissions:
  contents: read

jobs:
  export-validated-source:
    if: github.repository == 'speedyHKjournalist/v86' && github.ref == 'refs/heads/chat/ir-11-licm-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reconstruct exactly the tree whose tests passed in run 34735119024
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '90bdaf5bfd1a54ca8c45944877f03705be7bb271070e769f8fa95282ee9bdb46  tools/ir-forwarding-core.patch' \
            '0e2705974aac1c67562d5011ddda7cc899963f3cbcf859ec92df538aadf0ae51  tools/ir-forwarding-tests.patch' \
            'db5c07d3dc09bdc16d48309226ab6c0434c1cf2bb482b8c807036579a95cbf1d  tools/ir-forwarding-docs.patch' | sha256sum --check
          excludes=(--exclude=src/rust/ir/passes/mod.rs --exclude=tests/ir/semantics/cfg_frontend.rs --exclude=tests/ir/differential/cfg.mjs)
          patches=(tools/ir-forwarding-core.patch tools/ir-forwarding-tests.patch tools/ir-forwarding-docs.patch)
          git apply --check --index "${excludes[@]}" "${patches[@]}"
          git apply --index "${excludes[@]}" "${patches[@]}"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/rust/ir/passes/mod.rs')
          text = path.read_text()
          anchor = '    pub loop_hoisted: usize,\n'
          assert text.count(anchor) == 1 and 'pub ram_forwarded:' not in text
          path.write_text(text.replace(anchor, anchor + '    pub ram_forwarded: usize,\n'))
          path = Path('tests/ir/semantics/cfg_frontend.rs')
          text = path.read_text()
          anchor = '                        let mir = lower(&r).unwrap();\n'
          assert text.count(anchor) == 1 and 'forward_ram_reads' not in text
          assert 'fault fixtures must exercise LICM' in text
          replacement = '\n'.join([
              '                        let mut mir = lower(&r).unwrap();',
              '                        drop(r);',
              '                        if opt {',
              '                            mir.fold_constants().unwrap();',
              '                            mir.forward_ram_reads(crate::ir::mir::forwarding::DEFAULT_WORK_LIMIT)',
              '                                .unwrap();',
              '                        }', ''])
          path.write_text(text.replace(anchor, replacement))
          PY
          git add src/rust/ir/passes/mod.rs tests/ir/semantics/cfg_frontend.rs
          git rm -- .github/workflows/ir-forwarding-integration.yml tools/ir-forwarding-core.patch tools/ir-forwarding-tests.patch tools/ir-forwarding-docs.patch
          git diff --cached --check
          mkdir -p build
          test "$(git write-tree)" = 13adfe6fc4001b571cff2e3db4008fd24f8d756e
          git write-tree > build/ir-forwarding-tested-tree.txt
          git archive --format=tar.gz --output=build/ir-forwarding-tested-source.tar.gz 13adfe6fc4001b571cff2e3db4008fd24f8d756e
      - name: Export content-addressed blobs only; do not create a tree, commit or ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request, urllib.error
          def git(*args):
              return subprocess.check_output(['git', *args])
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'speedyHKjournalist/v86'
          expected = git('write-tree').decode().strip()
          assert expected == '13adfe6fc4001b571cff2e3db4008fd24f8d756e'
          entries, contents = [], {}
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw:
                  continue
              path = raw.decode()
              record = git('ls-files', '--stage', '--', path).decode().strip()
              if not record:
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, sha = record.split()[:2]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})
              contents[path] = git('show', ':' + path).decode('utf-8')
          report = {'parent': git('rev-parse', 'HEAD').decode().strip(),
                    'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
                    'tree': expected, 'entries': entries,
                    'validation_run': 34735119024, 'export_run': os.environ['GITHUB_RUN_ID'],
                    'blobs_exported': False}
          output = pathlib.Path('build/ir-forwarding-publication.json')
          output.write_text(json.dumps(report, indent=2))
          pathlib.Path('build/ir-forwarding-contents.json').write_text(json.dumps(contents))
          for entry in entries:
              if entry['sha'] is None:
                  continue
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + '/git/blobs',
                  data=json.dumps({'content': contents[entry['path']], 'encoding': 'utf-8'}).encode(),
                  method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2026-03-10'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      created = json.load(response)
              except urllib.error.HTTPError as error:
                  print(error.read().decode('utf-8', errors='replace'))
                  raise
              assert created['sha'] == entry['sha'], entry['path']
              print('EXPORTED', entry['sha'], entry['path'])
          report['blobs_exported'] = True
          output.write_text(json.dumps(report, indent=2))
          print('IR_FORWARDING_PUBLICATION=' + json.dumps(report))
          PY
      - name: Preserve exact source and publication manifest even if blob export is unavailable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ir-forwarding-publication-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ir-forwarding-tested-tree.txt
            build/ir-forwarding-publication.json
            build/ir-forwarding-contents.json
            build/ir-forwarding-tested-source.tar.gz
