name: IR development bootstrap

on:
  push:
    branches: ['chat/ir-continuation-20260913']
    paths: ['.github/workflows/ir-bootstrap.yml']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare public build dependencies and pinned reference objects
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nasm
          make closure-compiler/compiler.jar
          mkdir -p offline/bin
          cp /usr/bin/nasm offline/bin/nasm
          cp closure-compiler/compiler.jar offline/compiler.jar
          git fetch --no-tags --depth=1 origin 8ee73e538daaab15411344d39a1f271e778ac7f3
          git cat-file --batch-all-objects --batch-check='%(objectname)' | git pack-objects --stdout > offline/public-source-objects.pack
          tar -czf ir-build-dependencies.tar.gz -C offline .
      - uses: actions/upload-artifact@v7
        with:
          name: ir-build-dependencies
          path: ir-build-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
