[package]
name = "v86"
version = "0.1.0"
publish = false
edition = "2021"

[features]
default = []
profiler = []
jit-invariants = []
# Standalone experimental compiler; does not switch the production CPU backend.
ir-experimental = []
# Exports differential oracles only in the dedicated test Wasm artifact.
ir-test-hooks = ["ir-experimental"]

[lib]
crate-type = ["cdylib"]
path = "src/rust/lib.rs"

[profile.test]
lto = false
opt-level = 2
overflow-checks = false

[profile.dev]
lto = true
opt-level = 2
panic = "abort"
overflow-checks = false

[profile.release]
lto = true
opt-level = 3
incremental = false
panic = "abort"
