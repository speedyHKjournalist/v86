name: IR core

on:
  pull_request:
    branches: [ir]
  push:
    branches: [ir, 'chat/ir-*']

permissions:
  contents: read

concurrency:
  group: ir-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ir-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Rust and assembler
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt
          sudo apt-get update -qq
          sudo apt-get install -y nasm clang lld
      - name: Generated dispatch tables and decoder
        run: |
          mkdir -p build
          make src/rust/gen/interpreter.rs src/rust/gen/interpreter0f.rs src/rust/gen/jit.rs src/rust/gen/jit0f.rs src/rust/gen/analyzer.rs src/rust/gen/analyzer0f.rs
          make ir-generated-check
      - name: Native regressions
        run: |
          set -o pipefail
          env RUSTFLAGS="-D warnings" cargo test 2>&1 | tee build/ir-native.log
      - name: Executable Wasm and decoder oracles
        run: |
          node tests/ir/wasm/run.mjs
          node tests/rust/verify-wasmgen-dummy-output.js
          node tests/ir/decode/oracle.mjs
      - name: Actual CPU LICM and CFG differential regressions
        run: |
          set -o pipefail
          tools/ir-licm-tests.sh 2>&1 | tee build/ir-licm-cpu.log
          node tests/ir/differential/cfg.mjs
      - name: Guarded RAM forwarding and callback recovery
        run: |
          set -o pipefail
          tools/ir-forwarding-tests.sh 2>&1 | tee build/ir-forwarding-cpu.log
      - name: Guarded scalar store continuation and recovery
        run: |
          set -o pipefail
          sh tools/ir-store-continuation-tests.sh 2>&1 | tee build/ir-store-continuation-cpu.log
      - name: Generated sources and whitespace
        run: |
          git diff --exit-code
          git diff --check
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ir-diagnostics-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: build/ir-*.log
