<!doctype html><meta charset="utf-8"><title>CPU Worker AudioWorklet</title><pre id="result">RUNNING</pre>
<script type="module">
import {V86} from "../../build/libv86.mjs";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let vm;
try {
    vm=new V86({cpu_worker:true,cpu_worker_url:"../../build/cpu-worker.js",wasm_path:"../../build/v86.wasm",
        bios:{url:"../../build/cpu-worker-test.bin"},memory_size:32<<20,
        disable_keyboard:true,disable_mouse:true,net_device:{type:"none"},autostart:false});
    await Promise.race([new Promise((r,j)=>{vm.add_listener("emulator-loaded",r);vm.add_listener("emulator-error",j);}),sleep(10000).then(()=>{throw new Error("Audio initialization blocked on autoplay");})]);
    if(!vm.speaker_adapter.dac.node_processor) throw new Error("AudioWorklet missing");
    await vm.run();await sleep(50);
    const state=await vm.save_state();
    await vm.restore_state(state);
    await vm.stop();await vm.destroy();vm=null;
    document.getElementById("result").textContent="PASS AudioWorklet direct port initializes without autoplay, saves and restores";
} catch(e) {if(vm) vm.worker_controller.close();document.getElementById("result").textContent="FAIL "+e.stack;}
</script>
