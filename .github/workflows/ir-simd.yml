name: IR SIMD validation

on:
  pull_request:
    branches: [ir]
  push:
    branches: [chat/ir-simd-20260913-4d9c]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ir-simd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: '1.98.1'

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Install toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          sudo apt-get update -qq
          sudo apt-get install -y nasm
      - name: Native compiler and executable SIMD corpus
        run: |
          set -o pipefail
          mkdir -p build
          make ir-simd-opt-tests 2>&1 | tee build/ir-simd.log
          RUSTFLAGS="-D warnings" cargo test --locked 2>&1 | tee build/ir-native.log
      - name: Existing Wasm and decoder regression matrix
        run: |
          set -o pipefail
          {
            node tests/ir/wasm/run.mjs
            node tests/rust/verify-wasmgen-dummy-output.js
            node tests/ir/decode/oracle.mjs
            node tests/ir/coverage.mjs
          } 2>&1 | tee build/ir-regressions.log
      - name: Formatting and generated-source consistency
        run: |
          rustfmt --edition 2021 --check --config skip_children=true src/rust/ir/passes/simd.rs tests/ir/semantics/simd_opt.rs
          node --check tests/ir/wasm/simd_opt.mjs
          git diff --exit-code
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ir-simd-compiler-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: build/ir-*.log

  cpu-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Install CPU build tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          sudo apt-get update -qq
          sudo apt-get install -y nasm clang lld
      - name: SIMD register, memory and exception regressions
        run: |
          set -o pipefail
          mkdir -p build
          make ir-simd-lane-tests ir-simd-shuffle-tests ir-simd-integer-tests 2>&1 | tee build/ir-cpu-simd.log
      - name: CFG, memory, publication and tier regressions
        run: |
          set -o pipefail
          make ir-cfg-tests ir-memory-tests ir-live-tests ir-cache-tests ir-auto-tests ir-backend-integration-tests 2>&1 | tee build/ir-cpu-runtime.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ir-simd-cpu-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: build/ir-cpu-*.log
