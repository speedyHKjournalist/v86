<!doctype html>
<meta charset="utf-8">
<title>VGA + WebGPU integration</title>
<style>
    #screen { width: 800px; height: 600px; border: 5px solid black; padding: 12px;
        display: flex; align-items: center; justify-content: center; transform: scale(.75); transform-origin: top left; }
    #screen canvas:not([data-v86-graphics]) { width: 640px !important; height: 480px !important; }
    #screen.small canvas:not([data-v86-graphics]) { width: 320px !important; height: 240px !important; }
    #screen.full canvas:not([data-v86-graphics]) { width: 800px !important; height: 600px !important; }
</style>
<div id="screen"><div></div><canvas data-v86-graphics style="display:none"></canvas><canvas id="vga"></canvas></div>
<pre id="result">RUNNING</pre>
<script src="../../build/libv86.js"></script>
<script src="../../build/glbridge/libv86-webgpu.js"></script>
<script src="gl_stream_builder.js"></script>
<script>
(async () => {
    const checks = [];
    const check = (value, label) => { if (!value) throw new Error(label); checks.push(label); };
    const near = (a, b, label) => check(Math.abs(a - b) < 1, label + ` (${a} vs ${b})`);
    const container = document.getElementById("screen");
    const vga = document.getElementById("vga");
    const earlyOverlay = container.querySelector("[data-v86-graphics]");
    const { GLStream, GL } = GLTestStream;
    const create = (initial_state, graphics = true) => new V86({
        wasm_path: "../../build/v86.wasm", memory_size: 32 * 1024 * 1024,
        bios: { buffer: new Uint8Array(65536).fill(0xf4).buffer },
        screen_container: container, disable_keyboard: true, disable_mouse: true,
        disable_speaker: true, net_device: { type: "none" },
        graphics_adapter: graphics ? installV86GLGraphicsAdapter : undefined,
        graphics_options: { graphicsCanvas: earlyOverlay },
        initial_state, autostart: false,
    });
    const loaded = emulator => new Promise(resolve => emulator.add_listener("emulator-loaded", resolve));
    let emulator = create();
    await loaded(emulator);
    const bridge = emulator.graphics_adapter;
    check(!bridge.failed, "graphics initialization succeeded");
    check(bridge.screenCanvas === vga && vga.getContext("2d"), "VGA skips an earlier tagged overlay and keeps its 2D context");
    check(bridge.canvas === earlyOverlay && earlyOverlay.getContext("webgpu"), "WebGPU uses the independent overlay");
    check(bridge.glExecutor.device === bridge.d3d9Executor.device &&
        bridge.d3d8Executor.device === bridge.d3d9Executor.device, "all executors share one GPUDevice");
    check(bridge.canvas.style.display === "none", "text-mode boot has no graphics overlay");
    const gpu = bridge.glExecutor.device;
    const errors = [];
    gpu.addEventListener("uncapturederror", event => errors.push(event.error.message));
    gpu.pushErrorScope("validation");
    const screen = emulator.screen_adapter;
    screen.set_mode(true);
    screen.set_size_graphical(640, 480, 640, 480);
    const ctx = vga.getContext("2d");
    ctx.fillStyle = "blue";
    ctx.fillRect(0, 0, 640, 480);
    // Exercise the same modern virtio queue ABI as v86gl.sys before rendering.
    const cpu = emulator.v86.cpu, io = cpu.io;
    const ram = cpu.read_blob(0, 32 * 1024 * 1024);
    const memory = new DataView(ram.buffer, ram.byteOffset, ram.byteLength);
    const table = 0x10000, avail = table + 128, used = table + 160;
    const request = table + 256, reply = table + 288, arena = 0x100000;
    const w8 = (off, value) => io.port_write8(0xf100 + off, value);
    const w16 = (off, value) => io.port_write16(0xf100 + off, value);
    const w32 = (off, value) => io.port_write32(0xf100 + off, value);
    w8(20, 0); w8(20, 3);
    w32(8, 0); w32(12, 1); w32(8, 1); w32(12, 1); w8(20, 11);
    check(io.port_read8(0xf114) === 11, "virtio features negotiated");
    w16(22, 0); w16(24, 8);
    w32(32, table); w32(36, 0); w32(40, avail); w32(44, 0);
    w32(48, used); w32(52, 0);
    memory.setUint32(table, request, true); memory.setUint32(table + 8, 24, true);
    memory.setUint16(table + 12, 1, true); memory.setUint16(table + 14, 1, true);
    memory.setUint32(table + 16, reply, true); memory.setUint32(table + 24, 16, true);
    memory.setUint16(table + 28, 2, true); memory.setUint16(avail, 1, true);
    w16(28, 1); w8(20, 15);
    let idx = 0;
    const submit = (opcode, address, length, flags) => {
        [opcode, address, 0, length, flags, 0].forEach((v, i) => memory.setUint32(request + i * 4, v, true));
        memory.setUint32(reply, 0xffffffff, true);
        memory.setUint16(avail + 4 + (idx & 7) * 2, 0, true);
        memory.setUint16(avail + 2, ++idx, true);
        io.port_write16(0xf200, 0);
        if(memory.getUint16(used + 2, true) !== idx || memory.getUint32(reply, true) !== 0)
            throw new Error("virtio request failed: " + memory.getUint32(reply, true));
    };
    submit(1, arena, 16 * 1024 * 1024, 0);
    const draw = () => {
        const commands = new GLStream().makeCurrent(1, 100, 80, 200, 120)
            .call("CLEAR_COLOR", 1, 0, 0, 1).call("CLEAR", GL.COLOR_BUFFER_BIT).bytes();
        [0x324c4756, 1, 1, 1, 3, commands.length, 0, 0].forEach((v, i) => memory.setUint32(arena + i * 4, v, true));
        ram.set(commands, arena + 32);
        submit(2, 0, 32 + commands.length, 1);
    };
    draw();
    check(cpu.devices.v86gl_pci.submitCount === 1, "virtqueue submitted a real WebGPU frame");
    const aligned = () => {
        const base = vga.getBoundingClientRect(), overlay = bridge.canvas.getBoundingClientRect();
        near(overlay.left, base.left + base.width * 100 / 640, "overlay X follows VGA through borders and ancestor scale");
        near(overlay.top, base.top + base.height * 80 / 480, "overlay Y follows VGA");
        near(overlay.width, base.width * 200 / 640, "overlay width follows VGA");
        near(overlay.height, base.height * 120 / 480, "overlay height follows VGA");
    };
    aligned();
    check(bridge.canvas.style.pointerEvents === "none", "overlay passes input through");
    const screenshot = emulator.screen_make_screenshot();
    await screenshot.decode();
    const capture = document.createElement("canvas");
    capture.width = 640; capture.height = 480;
    const captureContext = capture.getContext("2d");
    captureContext.drawImage(screenshot, 0, 0);
    const pixel = (x, y) => Array.from(captureContext.getImageData(x, y, 1, 1).data);
    check(pixel(20, 20).join() === "0,0,255,255", "screenshot retains VGA outside the game window");
    check(pixel(150, 100).join() === "255,0,0,255", "screenshot composites WebGPU over VGA");
    const tick = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    container.className = "small";
    await tick(); aligned();
    container.className = "full";
    document.dispatchEvent(new Event("fullscreenchange"));
    await tick(); aligned();
    emulator.screen_set_scale(2, 2);
    aligned();
    check(!!bridge.d3d9Executor.shaderWorker, "bundled D3D9 worker starts");
    const tokens = new Uint32Array([0xfffe0101, 1, 0xc00f0000, 0x90e40000, 0xffff]);
    const translated = await bridge.d3d9Executor.compileShaderInWorker(tokens);
    const local = D3D9ShaderPipeline.compileShader(tokens);
    check(translated.ok && JSON.stringify(translated) === JSON.stringify(local), "worker and main-thread shader translations agree");
    check(D3D9ShaderPipeline.TRANSLATOR_REVISION === V86GL_BUILD_REVISION, "shader cache uses the bundle revision");
    const state = await emulator.save_state();
    const journalBytes = bridge.glJournalBytes;
    await emulator.restore_state(state);
    check(bridge.glJournalBytes === journalBytes && !bridge.restoringState, "restore awaits the graphics checkpoint");
    screen.set_mode(false);
    check(bridge.canvas.style.display === "none", "text-mode transition hides stale game pixels");
    screen.set_mode(true);
    check(bridge.canvas.style.display === "none", "VGA resumes before the next game Present");
    draw();
    bridge.hideOverlayCanvas();
    check(bridge.canvas.style.display === "none" && vga.style.display === "block", "game exit exposes VGA");
    const validation = await gpu.popErrorScope();
    check(!validation && !errors.length, "no WebGPU validation errors: " + (validation && validation.message || errors.join(";")));
    await emulator.destroy();
    check(container.querySelectorAll("canvas").length === 2 && bridge.destroyed, "destroy preserves caller-owned canvases and stops graphics");
    emulator = create({ buffer: state });
    await loaded(emulator);
    check(emulator.graphics_adapter.glJournalBytes === journalBytes && !emulator.graphics_adapter.restoringState,
        "initial_state restores graphics before emulator-loaded");
    await emulator.restart();
    check(emulator.graphics_adapter.glJournalBytes === 0 && emulator.graphics_adapter.activeOwner === null,
        "restart clears graphics resources and returns to VGA");
    await emulator.destroy();
    emulator = create(undefined, false);
    await loaded(emulator);
    check(!emulator.graphics_adapter && !emulator.v86.cpu.devices.v86gl_pci,
        "VGA-only instances do not create graphics hardware or a GPU adapter");
    const vgaOnlyState = await emulator.save_state();
    await emulator.restore_state(vgaOnlyState);
    await emulator.destroy();
    emulator = create({ buffer: vgaOnlyState });
    await loaded(emulator);
    check(emulator.graphics_adapter.glJournalBytes === 0 && !emulator.graphics_adapter.restoringState,
        "old snapshots without the graphics PCI device load with an empty graphics checkpoint");
    await emulator.destroy();
    return { status: "PASS", checks };
})().catch(error => ({ status: "FAIL", error: error.stack })).then(async result => {
    document.getElementById("result").textContent = JSON.stringify(result);
    if (new URLSearchParams(location.search).has("report"))
        await fetch("/__test_result", { method: "POST", body: JSON.stringify(result) });
});
</script>
