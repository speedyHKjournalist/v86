name: Snapshot IR merge base
on:
  push:
    branches: [chat/ir-dataflow-delivery-20260913]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 00da882962df72b4c39e8dd28f9f5a3bb1ac8639
          fetch-depth: 0
          persist-credentials: false
      - name: Archive pinned public source and Git history
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/ir-merge-source.tar.gz"
          git bundle create "$RUNNER_TEMP/ir-merge-history.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/ir-merge-sha.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: ir-merge-base-00da8829
          path: |
            ${{ runner.temp }}/ir-merge-source.tar.gz
            ${{ runner.temp }}/ir-merge-history.bundle
            ${{ runner.temp }}/ir-merge-sha.txt
          retention-days: 1
          compression-level: 0
