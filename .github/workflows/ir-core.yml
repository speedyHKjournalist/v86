name: IR core

on:
  pull_request:
    branches: [ir]
  push:
    branches: ['chat/ir-*']

permissions:
  contents: read

concurrency:
  group: ir-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ir-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Native Rust toolchain and decoder oracle
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          sudo apt-get update -y
          sudo apt-get install -y nasm
      - name: Generate baseline dispatch tables and check IR decoder
        run: |
          mkdir -p build
          make src/rust/gen/interpreter.rs src/rust/gen/interpreter0f.rs src/rust/gen/jit.rs src/rust/gen/jit0f.rs src/rust/gen/analyzer.rs src/rust/gen/analyzer0f.rs
          make ir-generated-check
      - name: Targeted LICM regressions
        run: env RUSTFLAGS="-D warnings" cargo +stable test ir::passes::licm -- --nocapture
      - name: LICM emitted Wasm
        run: node tests/ir/wasm/licm.mjs
      - name: Native compiler regressions
        run: env RUSTFLAGS="-D warnings" cargo +stable test
      - name: Execute emitted Wasm and decoder oracle
        run: |
          node tests/ir/wasm/run.mjs
          node tests/rust/verify-wasmgen-dummy-output.js
          node tests/ir/decode/oracle.mjs
      - name: Rust formatting
        if: always()
        run: RUSTC_BOOTSTRAP=1 cargo +stable fmt --all -- --check
      - name: Check tracked generated sources
        run: git diff --exit-code

  ir-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Install native and Wasm toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          sudo apt-get update -y
          sudo apt-get install -y nasm clang lld
      - name: Build CPU and execute IR differential tests
        run: make ir-tests ir-cfg-tests ir-loop-tests ir-memory-tests ir-stack-tests
      - name: Live compilation, cache, tiers and public backend
        run: make ir-live-tests ir-cache-tests ir-auto-tests ir-backend-integration-tests
      - name: Check tracked generated sources
        run: git diff --exit-code
