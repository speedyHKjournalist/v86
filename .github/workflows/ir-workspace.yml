name: IR workspace bootstrap

on:
  push:
    branches: ['chat/ir-continuation-20260913']
    paths: ['.github/workflows/ir-workspace.yml']

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install minimal compiler
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt
          sudo apt-get update -y
          sudo apt-get install -y nasm
      - name: Package reproducible source and compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ir-workspace/toolchain /tmp/ir-workspace/source /tmp/ir-workspace/bin
          git archive HEAD | tar -xf - -C /tmp/ir-workspace/source
          toolchain="$(dirname "$(dirname "$(rustup which rustc)")")"
          cp -a "$toolchain/bin" /tmp/ir-workspace/toolchain/
          mkdir -p /tmp/ir-workspace/toolchain/lib/rustlib
          cp -a "$toolchain"/lib/*.so* /tmp/ir-workspace/toolchain/lib/
          cp -a "$toolchain/lib/rustlib/x86_64-unknown-linux-gnu" /tmp/ir-workspace/toolchain/lib/rustlib/
          cp -a "$toolchain/lib/rustlib/wasm32-unknown-unknown" /tmp/ir-workspace/toolchain/lib/rustlib/
          cp /usr/bin/nasm /tmp/ir-workspace/bin/
          rustc --version > /tmp/ir-workspace/VERSIONS.txt
          cargo --version >> /tmp/ir-workspace/VERSIONS.txt
          git rev-parse HEAD >> /tmp/ir-workspace/VERSIONS.txt
          tar -C /tmp/ir-workspace -czf /tmp/ir-workspace.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: ir-workspace
          path: /tmp/ir-workspace.tar.gz
          retention-days: 1
          compression-level: 0
